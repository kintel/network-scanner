[project]
name = "network-scanner"
version = "0.1.0"
description = "Nmap subnet scanner and Google Sheets synchronization tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "configargparse>=1.7",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "python-libnmap>=0.7.3",
]

[project.scripts]
network-scanner = "network_scanner:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["network_scanner.py", "network-scanner.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
include = ["network_scanner.py", "network-scanner.py", "tests/**/*.py"]


